name: MarkDesk

on:
  pull_request:
    paths:
      - "apps/markdesk/**"
      - "schemas/desk-api.json"
      - "scripts/check_desk_client.sh"
      - ".github/workflows/markdesk.yaml"

permissions:
  contents: read

jobs:
  web:
    name: MarkDesk web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm --prefix apps/markdesk ci
      - run: npm --prefix apps/markdesk run typecheck
      - run: npm --prefix apps/markdesk test
      - run: npm --prefix apps/markdesk run build
      - run: bash scripts/check_desk_client.sh
