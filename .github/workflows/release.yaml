name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.1)"
        required: true
        default: "v0.6.1"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: markspec
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: markspec
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: markspec
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: markspec
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: markspec.exe
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache tree-sitter grammars
        id: grammars-cache
        uses: actions/cache@v6.1.0
        with:
          path: grammars/*.wasm
          key: grammars-${{ hashFiles('grammars/grammars.lock') }}

      - name: Fetch grammars
        if: steps.grammars-cache.outputs.cache-hit != 'true'
        run: deno task fetch-grammars

      - name: Compile
        run: |
          deno run --allow-read --allow-write --allow-run --allow-env \
            scripts/compile_binary.ts \
            --target ${{ matrix.target }} \
            --output ${{ matrix.binary }}

      - name: Package
        run: |
          tar czf markspec-${{ matrix.target }}.tar.gz ${{ matrix.binary }}
          # macOS ships shasum (Perl); Linux + Windows Git-Bash ship sha256sum.
          # Both produce the same "HASH  FILE" output format.
          if command -v sha256sum >/dev/null; then
            sha256sum markspec-${{ matrix.target }}.tar.gz > markspec-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 markspec-${{ matrix.target }}.tar.gz > markspec-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markspec-${{ matrix.target }}
          path: |
            markspec-${{ matrix.target }}.tar.gz
            markspec-${{ matrix.target }}.tar.gz.sha256

  package-vsix:
    name: Package VSIX (${{ matrix.vsce-target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            vsce-target: linux-x64
            binary: markspec
          - target: x86_64-apple-darwin
            vsce-target: darwin-x64
            binary: markspec
          - target: aarch64-apple-darwin
            vsce-target: darwin-arm64
            binary: markspec
          - target: x86_64-pc-windows-msvc
            vsce-target: win32-x64
            binary: markspec.exe
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: markspec-${{ matrix.target }}
          path: artifacts

      - name: Extract binary
        run: |
          cd artifacts
          tar xzf markspec-${{ matrix.target }}.tar.gz

      - name: Bundle binary into extension
        # editors/vscode has its own package.json (which Deno picks up as a
        # config file by default) but is not part of the root deno.json
        # workspace. Pin to the root config so the script's @std/* imports
        # resolve correctly.
        run: |
          deno run --config deno.json --allow-read --allow-write \
            editors/vscode/scripts/bundleBinary.ts \
            --source artifacts/${{ matrix.binary }} \
            --name ${{ matrix.binary }}

      - name: Install extension deps
        run: cd editors/vscode && npm ci

      - name: Compile extension
        run: cd editors/vscode && npm run compile

      - name: Package VSIX
        run: |
          cd editors/vscode
          npx vsce package --target ${{ matrix.vsce-target }} \
            --out markspec-ide-${{ matrix.vsce-target }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: markspec-ide-${{ matrix.vsce-target }}-vsix
          path: editors/vscode/markspec-ide-${{ matrix.vsce-target }}.vsix

  publish-vsce:
    name: Publish to VS Code Marketplace
    needs: package-vsix
    runs-on: ubuntu-latest
    # Manual-approval gate: the `marketplace` environment must require reviewers
    # in repo settings. The release job does NOT depend on this job, so a
    # non-approval or publish failure here can never fail the GitHub Release.
    environment: marketplace
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          path: vsix
          pattern: markspec-ide-*-vsix
          merge-multiple: true

      - name: Publish each platform VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # Re-run caveat: vsce publish is NOT idempotent — re-running this job
        # after a partial success re-attempts already-published platforms and
        # will fail on the first one. If a release partially publishes, publish
        # the remaining platforms manually rather than blindly re-running.
        run: |
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE"/vsix/*.vsix)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::expected 4 VSIX artifacts, found ${#files[@]}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Publishing $f to VS Code Marketplace"
            npx -y vsce publish --packagePath "$f" --pat "$VSCE_PAT"
          done

  publish-ovsx:
    name: Publish to Open VSX
    needs: package-vsix
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          path: vsix
          pattern: markspec-ide-*-vsix
          merge-multiple: true

      - name: Publish each platform VSIX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        # Re-run caveat: ovsx publish is NOT idempotent — see publish-vsce.
        run: |
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE"/vsix/*.vsix)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::expected 4 VSIX artifacts, found ${#files[@]}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Publishing $f to Open VSX"
            npx -y ovsx publish "$f" --pat "$OVSX_PAT"
          done

  release:
    name: GitHub Release
    needs: [build, package-vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.vsix

  publish-jsr:
    name: Publish to JSR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish
        run: deno publish --allow-dirty

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Build npm package
        run: deno run -A scripts/build_npm.ts ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Publish
        run: cd npm && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
