name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: markspec
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: markspec
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: markspec
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: markspec.exe
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile
        run: |
          deno run --allow-read --allow-write --allow-run --allow-env \
            scripts/compile_binary.ts \
            --target ${{ matrix.target }} \
            --output ${{ matrix.binary }}

      - name: Package
        run: |
          tar czf markspec-${{ matrix.target }}.tar.gz ${{ matrix.binary }}
          shasum -a 256 markspec-${{ matrix.target }}.tar.gz > markspec-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markspec-${{ matrix.target }}
          path: |
            markspec-${{ matrix.target }}.tar.gz
            markspec-${{ matrix.target }}.tar.gz.sha256

  package-vsix:
    name: Package VSIX (${{ matrix.vsce-target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            vsce-target: linux-x64
            binary: markspec
          - target: x86_64-apple-darwin
            vsce-target: darwin-x64
            binary: markspec
          - target: aarch64-apple-darwin
            vsce-target: darwin-arm64
            binary: markspec
          - target: x86_64-pc-windows-msvc
            vsce-target: win32-x64
            binary: markspec.exe
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: markspec-${{ matrix.target }}
          path: artifacts

      - name: Extract binary
        run: |
          cd artifacts
          tar xzf markspec-${{ matrix.target }}.tar.gz

      - name: Bundle binary into extension
        run: |
          deno run --allow-read --allow-write \
            editors/vscode/scripts/bundleBinary.ts \
            --source artifacts/${{ matrix.binary }} \
            --name ${{ matrix.binary }}

      - name: Install extension deps
        run: cd editors/vscode && npm ci

      - name: Compile extension
        run: cd editors/vscode && npm run compile

      - name: Package VSIX
        run: |
          cd editors/vscode
          npx vsce package --target ${{ matrix.vsce-target }} \
            --out markspec-ide-${{ matrix.vsce-target }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: markspec-ide-${{ matrix.vsce-target }}-vsix
          path: editors/vscode/markspec-ide-${{ matrix.vsce-target }}.vsix

  release:
    name: GitHub Release
    needs: [build, package-vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2.6.1
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.vsix

  publish-jsr:
    name: Publish to JSR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish
        run: deno publish --allow-dirty

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Build npm package
        run: deno run -A scripts/build_npm.ts ${{ github.ref_name }}

      - name: Publish
        run: cd npm && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
