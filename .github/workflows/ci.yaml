name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: every job only reads the checkout. None of the CI
# jobs comment on PRs, push code, or create releases — those workflows
# (e.g. `release.yaml`) declare their own permissions.
permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check

  prim:
    name: Prim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/install_prim.sh
      - run: ~/.local/bin/prim fmt --check .
      - run: ~/.local/bin/prim lint .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint

  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check packages/markspec/main.ts packages/markspec/core/mod.ts packages/markspec/lsp/server.ts packages/markspec/mcp/server.ts packages/markspec/desk/server.ts

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache tree-sitter grammars
        id: grammars-cache
        uses: actions/cache@v6.1.0
        with:
          path: grammars/*.wasm
          key: grammars-${{ hashFiles('grammars/grammars.lock') }}
      - name: Fetch grammars
        if: steps.grammars-cache.outputs.cache-hit != 'true'
        run: deno task fetch-grammars
      - run: deno test --allow-read --allow-write --allow-run --allow-env --allow-ffi --allow-net

  test-summary:
    # Umbrella status for the `test` matrix. Branch protection on `main`
    # requires a check literally named `Test`; the matrix expansion posts
    # `Test (ubuntu-latest)` / `(macos-latest)` / `(windows-latest)`, so
    # this aggregator is what satisfies the required-check rule. Adding
    # or removing matrix legs needs no branch-protection change.
    name: Test
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Verify matrix succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix did not succeed: ${{ needs.test.result }}"
            exit 1
          fi

  tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bash scripts/check_tokens.sh

  ast-fidelity-matrix:
    name: AST fidelity matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bash scripts/check_ast_fidelity_matrix.sh

  pwsh-installer:
    name: PowerShell installer syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1).Path, [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly."

  sh-installer:
    name: POSIX installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint install.sh (POSIX sh)
        run: shellcheck -s sh install.sh
      - name: Test installer checksum verification
        run: sh scripts/test_install.sh

  compile-smoke:
    name: Compiled binary smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache tree-sitter grammars
        id: grammars-cache
        uses: actions/cache@v6.1.0
        with:
          path: grammars/*.wasm
          key: grammars-${{ hashFiles('grammars/grammars.lock') }}
      - name: Fetch grammars
        if: steps.grammars-cache.outputs.cache-hit != 'true'
        run: deno task fetch-grammars
      - name: Compile binary
        run: |
          deno run --allow-read --allow-write --allow-run --allow-env \
            scripts/compile_binary.ts --output dist/markspec
      - name: Smoke test — help
        run: ./dist/markspec --help
      - name: Smoke test — validate .tsx source file
        run: |
          set +e
          ./dist/markspec validate tests/fixtures/in-code-tsx.tsx
          rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi
      - name: Smoke test — validate .ts source file
        run: |
          set +e
          ./dist/markspec validate tests/fixtures/in-code-typescript.ts
          rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi
      - name: Smoke test — compile with source files
        run: |
          mkdir -p /tmp/smoke-project
          cat > /tmp/smoke-project/project.yaml <<'EOF'
          name: smoke-test
          version: 0.1.0
          EOF
          cp tests/fixtures/in-code-tsx.tsx /tmp/smoke-project/component.tsx
          cp tests/fixtures/requirement-block.md /tmp/smoke-project/requirements.md
          ./dist/markspec compile --format json /tmp/smoke-project
      - name: Smoke test — desk serves and stops when stdin closes
        run: bash scripts/check_desk_binary.sh dist/markspec tests/fixtures/desk-project
      - name: Smoke test — doc build renders a PDF
        run: |
          set -e
          bin="$PWD/dist/markspec"
          root="$(mktemp -d)"
          tmp="$(mktemp -d)"
          mkdir "$root/assets" "$root/docs"
          cd "$root/docs"
          printf 'name: t\nversion: 0.1.0\n' > project.yaml
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10"/></svg>\n' > "$root/assets/d.svg"
          printf '# T\n\nHello.\n\n![d](../assets/d.svg)\n' > t.md
          # A parent-directory asset renders only when the staged package does
          # not narrow the Typst workspace root to the document folder.
          TMPDIR="$tmp" "$bin" doc build t.md
          test -s t.pdf
          leftovers() { find "$root/docs" "$tmp" -maxdepth 1 -name '*markspec-typst-*'; }
          test -z "$(leftovers)" || { echo "staged folder left behind"; leftovers; exit 1; }
          # A failing build must also remove the staged folder.
          printf '# T\n\n![x](missing.svg)\n' > bad.md
          set +e
          TMPDIR="$tmp" "$bin" doc build bad.md
          rc=$?
          set -e
          test $rc -ne 0 || { echo "failing doc build exited 0"; exit 1; }
          test -z "$(leftovers)" || { echo "staged folder left behind after failure"; leftovers; exit 1; }
      - name: Smoke test — self-upgrade reaches the network
        run: |
          set +e
          # --check contacts api.github.com. An unauthenticated rate limit is
          # not a regression, so it only warns.
          out="$(./dist/markspec self-upgrade --check 2>&1)"
          rc=$?
          echo "$out"
          if echo "$out" | grep -q "Requires net access"; then exit 1; fi
          if echo "$out" | grep -qiE "rate limit|status 403"; then
            echo "::warning::GitHub API rate limit reached; --check not verified"
          elif [ $rc -ne 0 ] && [ $rc -ne 1 ]; then
            exit $rc
          fi
          # A pinned install contacts the release download hosts (tarball and
          # checksum). It runs on a copy, because self-upgrade replaces its
          # own binary and refuses names that do not start with "markspec".
          copydir="$(mktemp -d)"
          cp dist/markspec "$copydir/markspec"
          # Retry any failure up to 3 attempts (waits of 5 s and 15 s); each
          # attempt is limited to 180 s so a stalled download reaches a retry.
          # A permission error is the regression this step guards: fail at once.
          for wait in 5 15 0; do
            out="$(timeout 180 "$copydir/markspec" self-upgrade --version v0.12.0 2>&1)"
            rc=$?
            echo "$out"
            if echo "$out" | grep -q "Requires net access"; then exit 1; fi
            test $rc -eq 0 && break
            if [ "$wait" -eq 0 ]; then echo "self-upgrade failed after 3 attempts"; exit 1; fi
            echo "::warning::self-upgrade failed (exit $rc); retrying in ${wait}s"
            sleep "$wait"
          done
          "$copydir/markspec" --version | grep -q "0.12.0"
      - name: Smoke test — lock fetches a snapshot over HTTP
        run: |
          set -e
          bin="$PWD/dist/markspec"
          dir="$(mktemp -d)"
          mkdir "$dir/site" "$dir/proj"
          printf '%s' '{"markspecSchemaVersion":1,"generator":{"coreSchema":1},"entries":{"format":"inline","file":"entries.json"}}' > "$dir/site/manifest.json"
          printf '%s' '{"entries":{}}' > "$dir/site/entries.json"
          # 127.0.0.2 lies outside the old 127.0.0.1 allowlist, so a permission
          # regression fails this step. It needs Linux (macOS cannot bind it).
          # Port 0 lets the OS pick a free port; the server prints it.
          (cd "$dir/site" && exec python3 -u -c 'import http.server as h; s = h.ThreadingHTTPServer(("127.0.0.2", 0), h.SimpleHTTPRequestHandler); print(s.server_address[1], flush=True); s.serve_forever()' > "$dir/port" 2> /dev/null) &
          server_pid=$!
          trap 'kill "$server_pid" 2> /dev/null || true' EXIT
          port=""
          for _ in $(seq 1 20); do
            port="$(cat "$dir/port" 2> /dev/null || true)"
            if [ -n "$port" ] && curl -sf -o /dev/null "http://127.0.0.2:$port/manifest.json"; then break; fi
            port=""
            sleep 0.5
          done
          if [ -z "$port" ]; then echo "snapshot server did not answer on 127.0.0.2"; exit 1; fi
          printf 'name: t\nversion: 0.1.0\nreferences:\n  - url: http://127.0.0.2:%s\n    name: snap\n' "$port" > "$dir/proj/project.yaml"
          cd "$dir/proj"
          set +e
          out="$("$bin" lock 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "MSL-L213"; then exit 1; fi
          test $rc -eq 0
          echo "$out" | grep -q "1 registries"

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: |
          curl -fsSL https://github.com/driftsys/git-std/releases/download/v0.10.2/git-std-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin ./git-std
          git-std --version
      - run: git-std check --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
