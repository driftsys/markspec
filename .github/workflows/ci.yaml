name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: every job only reads the checkout. None of the CI
# jobs comment on PRs, push code, or create releases — those workflows
# (e.g. `release.yaml`) declare their own permissions.
permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check

  dprint:
    name: Dprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dprint/check@v2.3

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint
      - uses: DavidAnson/markdownlint-cli2-action@v23

  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check packages/markspec/main.ts packages/markspec/core/mod.ts packages/markspec/lsp/server.ts packages/markspec/mcp/server.ts

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-read --allow-write --allow-run --allow-env --allow-ffi --allow-net

  test-summary:
    # Umbrella status for the `test` matrix. Branch protection on `main`
    # requires a check literally named `Test`; the matrix expansion posts
    # `Test (ubuntu-latest)` / `(macos-latest)` / `(windows-latest)`, so
    # this aggregator is what satisfies the required-check rule. Adding
    # or removing matrix legs needs no branch-protection change.
    name: Test
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Verify matrix succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix did not succeed: ${{ needs.test.result }}"
            exit 1
          fi

  tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bash scripts/check_tokens.sh

  ast-fidelity-matrix:
    name: AST fidelity matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bash scripts/check_ast_fidelity_matrix.sh

  pwsh-installer:
    name: PowerShell installer syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1).Path, [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly."

  compile-smoke:
    name: Compiled binary smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile binary
        run: |
          deno run --allow-read --allow-write --allow-run --allow-env \
            scripts/compile_binary.ts --output dist/markspec
      - name: Smoke test — help
        run: ./dist/markspec --help
      - name: Smoke test — validate .tsx source file
        run: |
          set +e
          ./dist/markspec validate tests/fixtures/in-code-tsx.tsx
          rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi
      - name: Smoke test — validate .ts source file
        run: |
          set +e
          ./dist/markspec validate tests/fixtures/in-code-typescript.ts
          rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 2 ]; then exit $rc; fi
      - name: Smoke test — compile with source files
        run: |
          mkdir -p /tmp/smoke-project
          cat > /tmp/smoke-project/project.yaml <<'EOF'
          name: smoke-test
          version: 0.1.0
          EOF
          cp tests/fixtures/in-code-tsx.tsx /tmp/smoke-project/component.tsx
          cp tests/fixtures/requirement-block.md /tmp/smoke-project/requirements.md
          ./dist/markspec compile --format json /tmp/smoke-project

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          curl -fsSL https://github.com/driftsys/git-std/releases/download/v0.10.2/git-std-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin ./git-std
          git-std --version
      - run: git-std check --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
