name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/spec/**"
      - "docs/guide/**"
      - "theme/**"
      - "docs/cheatsheet/**"
      - "docs/index.html"
      - "schemas/**"
      - ".github/workflows/pages.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build books
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          # Pinned, not "latest": mdBook 0.5 changed the menu-bar's DOM (id
          # renamed, icon-font glyphs replaced with inline SVG) in a way that
          # broke a custom additional-js script silently — contributors
          # testing against an older local mdbook (e.g. Homebrew's cached
          # version) got no warning locally. Bump deliberately, and re-verify
          # any additional-css/additional-js customization against the new
          # version's live output before bumping.
          mdbook-version: "0.5.3"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Regenerate tokens
        run: deno run --allow-read --allow-write scripts/gen_theme.ts

      - name: Build language spec book
        run: mdbook build docs/spec/language

      - name: Build typography book
        run: mdbook build docs/spec/typography

      - name: Build model reference book
        run: mdbook build docs/spec/model

      - name: Build extensions book
        run: mdbook build docs/spec/extensions

      - name: Build guide book
        run: mdbook build docs/guide

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Build cheat sheet
        run: typst compile --font-path packages/markspec-typst/fonts docs/cheatsheet/markspec-cheatsheet.typ _site/markspec-cheatsheet.pdf

      - name: Copy theme, schemas, and landing page
        run: |
          # Load-bearing for all 5 mdBook books, not just the landing page:
          # mdBook never copies additional-css/additional-js — each
          # book.toml's additional-css/additional-js instead link out via a
          # relative ../ path to these shared files. Do not remove without
          # updating every book's stylesheet/script link (see ADR-033).
          mkdir -p _site/theme
          cp theme/markspec.css _site/theme/markspec.css
          cp theme/markspec-home.js _site/theme/markspec-home.js
          mkdir -p _site/schemas && cp -R schemas/. _site/schemas/
          cp docs/index.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
