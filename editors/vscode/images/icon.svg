<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- MarkSpec marketplace icon. A specification ledger book carrying the
       MarkSpec entry bracket `[ ]` — the brand's own authoring syntax
       (`- [TYPE_NNNN]`), deliberately NOT the markdown "M↓" mark. Serious
       graphite/steel palette with a single restrained steel-blue accent
       (#5E93B8) on the bracket glyph. Near-square 5px tile corners. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c323a"/>
      <stop offset="1" stop-color="#171b20"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a636e"/>
      <stop offset="1" stop-color="#3c434c"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="5" fill="url(#bg)"/>
  <!-- book: page block, cover, spine -->
  <g>
    <rect x="36" y="26" width="58" height="76" rx="3" fill="#cfd4da"/>
    <rect x="36" y="26" width="54" height="76" rx="3" fill="#e9edf1"/>
    <rect x="32" y="24" width="54" height="80" rx="4" fill="url(#cover)"/>
    <rect x="32" y="24" width="9" height="80" rx="4" fill="#2f353d"/>
  </g>
  <!-- entry brackets [ ] -->
  <g fill="none" stroke="#5e93b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 48 L51 48 L51 80 L58 80"/>
    <path d="M72 48 L79 48 L79 80 L72 80"/>
  </g>
  <!-- cursor inside the brackets -->
  <rect x="62" y="58" width="6" height="14" rx="2" fill="#e9edf1"/>
</svg>
