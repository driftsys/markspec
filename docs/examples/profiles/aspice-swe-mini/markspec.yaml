# Strawman profile used to validate ADR-008 schema shape (post-ADR-009 revision).
# Not a complete ASPICE profile — a minimal vertical exercising every section
# of the profile schema for design review.

id: "@markspec/profile-aspice-swe-mini"
version: 0.1.0
description: Minimal ASPICE SWE vertical (design validation)
license: MIT
extends: "npm:@markspec/profile-default@^1.0"

profile:

  # ==========================================================================
  # Universal — applies to every entry regardless of shape or type
  # ==========================================================================
  attributes:
    - { name: External-id, type: external-id, cardinality: 0..1 }

  labels:
    # ASIL — mutually exclusive safety integrity level
    - QM
    - ASIL-A
    - ASIL-B
    - ASIL-C
    - ASIL-D
    # Ungrouped
    - security
    - automated
    - manual

  # ==========================================================================
  # Per-shape defaults (the two core shapes from ADR-009 §1)
  # ==========================================================================
  identified:
    attributes:
      - { name: Derived-from, type: id-list }
      - { name: Realized-by,  type: id-list }
      - { name: Verifies,     type: id-list }
      - { name: Tests,        type: id-list }
    traceability:
      Derived-from: { target: [{ shape: identified }] }

  referenced:
    attributes:
      - { name: Reference-url, type: url, cardinality: 0..1 }

  # ==========================================================================
  # Per-type — each type declares its shape and tightens rules
  # ==========================================================================
  types:
    stakeholder-requirement:
      shape: identified
      color: primary
      description: Stakeholder requirement (SWE.1 input)
      display-id-pattern: "STK_{scope}_{n:04d}"

    software-requirement:
      shape: identified
      color: primary
      description: Software requirement (SWE.1 output)
      display-id-pattern: "SRS_{scope}_{n:04d}"
      required: [Derived-from]
      traceability:
        Derived-from:
          target: [stakeholder-requirement]
          cardinality: 1..N
          required: true

    software-element:
      shape: identified
      color: secondary
      description: Software element spec (SWE.2)
      display-id-pattern: "SWE_{scope}_{n:04d}"
      required: [Derived-from, Realized-by]
      traceability:
        Derived-from:
          target: [software-requirement]
          cardinality: 1..N
          required: true
        Realized-by:
          target: [unit]
          cardinality: 1..N
          required: true

    unit:
      shape: identified
      color: tertiary
      description: Source-code unit (function, method, module)
      # display-id-pattern-enforcement: off  # namespace-path IDs
      attributes:
        - { name: Element-kind, type: enum, values: [module, class, function, source] }

    unit-test:
      shape: identified
      color: danger
      description: Software unit test (SWE.4)
      display-id-pattern: "SWT_{scope}_{n:04d}"
      required: [Verifies, Tests]
      traceability:
        Verifies:
          target: [software-requirement, software-element]
          cardinality: 1..N
          required: true
        Tests:
          target: [unit]
          cardinality: 1..N
          required: true

    integration-test:
      shape: identified
      color: danger
      description: Software integration test (SWE.5)
      display-id-pattern: "SIT_{scope}_{n:04d}"
      required: [Verifies]
      traceability:
        Verifies:
          target: [software-requirement, software-element]
          cardinality: 1..N
          required: true

    standard:
      shape: referenced
      description: External normative standard (ISO, DO, IEC, RFC, …)

  # ==========================================================================
  # Document-level
  # ==========================================================================
  documents:
    # Each profile declares its own document types and contains: mappings.
    # The core does not bake in any document-type vocabulary (per ADR-008
    # post-ADR-009 revision).
    types:
      - id: requirements
        contains: [stakeholder-requirement, software-requirement]
      - id: architecture
        contains: [software-element]
      - id: tests
        contains: [unit-test, integration-test]
      - id: references
        contains: [standard]
    frontMatter:
      - { name: asil, type: enum, values: [QM, A, B, C, D], cardinality: 0..1 }
      - { name: safety-goal, type: text, cardinality: 0..1 }
