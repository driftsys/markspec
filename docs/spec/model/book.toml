[book]
title = "MarkSpec Model Reference"
authors = ["DriftSys"]
language = "en"
src = "."

[build]
build-dir = "../../../_site/model"

[output.html]
no-section-label = true
# mdBook resolves this path twice: from the book's source root (to find the
# real file to copy) and from `build-dir` (to build the deployed <link>/
# <script> href). `build-dir` is 1 level under the shared `_site/`, so the
# href must stay a single `../` — the source-side lookup is satisfied by the
# docs/spec/theme/ symlinks to the canonical theme/markspec.css and
# theme/markspec-home.js (shared by all 4 spec-family books). See ADR-033.
# Do not delete those symlinks.
additional-css = ["../theme/markspec.css"]
additional-js = ["../theme/markspec-home.js"]
git-repository-url = "https://github.com/driftsys/markspec"
edit-url-template = "https://github.com/driftsys/markspec/edit/main/docs/spec/model/{path}"
