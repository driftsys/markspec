[book]
title = "MarkSpec Model Reference"
authors = ["DriftSys"]
language = "en"
src = "."

[build]
build-dir = "../../../_site/model"

[output.html]
no-section-label = true
# mdBook resolves this path twice: from the book's source root (to find the
# real file to copy) and from `build-dir` (to build the deployed <link>
# href). `build-dir` is 1 level under the shared `_site/`, so the href must
# stay a single `../` — the source-side lookup is satisfied by the
# docs/spec/theme/markspec.css symlink to the canonical theme/markspec.css
# (shared by all 3 spec books). See ADR-033. Do not delete that symlink.
additional-css = ["../theme/markspec.css"]
git-repository-url = "https://github.com/driftsys/markspec"
edit-url-template = "https://github.com/driftsys/markspec/edit/main/docs/spec/model/{path}"
