[package]
name = "markdesk"
version = "0.0.0"
edition = "2021"
publish = false
description = "MarkDesk desktop authoring app for MarkSpec"

[lib]
name = "markdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-store = "=2.5.0"
