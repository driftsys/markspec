id: "@acme/profile-complete"
version: 1.2.3
description: A complete fixture exercising every Phase 1 parser feature
license: MIT
extends: "./base"
profile:
  required: [Status]
  labels: [DRAFT, INTERNAL]
  attributes:
    - name: Status
      type: enum
      values: [draft, approved, deprecated]
      required: false
  identified:
    required: [Rationale]
    attributes:
      - name: Rationale
        type: text
    traceability:
      Derived-from:
        target: [{ shape: identified }]
        cardinality: 0..N
        required: false
  referenced:
    required: []
    attributes:
      - name: Description
        type: text
  types:
    requirement:
      shape: identified
      display-id-pattern: "REQ-{n:04d}"
      display-id-pattern-enforcement: warn
      required: [Rationale]
      attributes:
        - name: ASIL
          type: enum
          values: [QM, A, B, C, D]
      traceability:
        Derived-from:
          target: [stakeholder-requirement]
          cardinality: 1..N
          required: true
    test:
      shape: identified
      display-id-pattern: "TEST-{n:04d}"
      attributes:
        - name: Verifies
          type: id-list
          inverse:
            name: Verified-by
            category: requirement
    standard:
      shape: referenced
  documents:
    types:
      - id: requirements-doc
        contains: [requirement]
      - id: test-plan
        contains: [test]
    frontMatter:
      - name: document-version
        type: text
