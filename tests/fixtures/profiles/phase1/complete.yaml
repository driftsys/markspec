id: "@acme/profile-complete"
version: 1.2.3
markspec-schema: "1"
description: A complete fixture exercising every Phase 1 parser feature
license: MIT
extends: "./base"
profile:
  labels: [DRAFT, INTERNAL]
  attributes:
    - name: Status
      type: enum
      values: [draft, approved, deprecated]
      required: false
  types:
    requirement:
      extends: Requirement
      display-id-pattern: "REQ-{n:04d}"
      display-id-pattern-enforcement: warn
      required: [Rationale]
      attributes:
        - name: ASIL
          type: enum
          values: [QM, A, B, C, D]
      traceability:
        Derived-from:
          target: [stakeholder-requirement]
          cardinality: 1..N
          required: true
    test:
      extends: Requirement
      display-id-pattern: "TEST-{n:04d}"
      attributes:
        - name: Verifies
          type: id-list
          inverse:
            name: Verified-by
            category: requirement
    standard:
      extends: Specification
  documents:
    types:
      - id: requirements-doc
        contains: [requirement]
      - id: test-plan
        contains: [test]
    frontMatter:
      - name: document-version
        type: text
